<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>PWA - TP1</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  </head>
  <body>
    <div id="app" class="container mt-3">
      <p class="fs-4">
        Hola, mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}}.
      </p>
      <p class="fs-1 fw-bold">{{contador}}</p>
      <button class="btn btn-primary" v-on:click="incrementar">
        Incrementar
      </button>
      <button class="btn btn-primary" v-on:click="decrementar">
        Decrementar
      </button>
      <div class="mt-5 w-75">
        <div class="mb-3 d-flex gap-2">
          <input
            class="form-control"
            type="text"
            placeholder="Ingresar Tarea"
            v-model="nuevaTarea"
          />
          <button class="btn btn-primary text-nowrap" v-on:click="agregarTarea">
            Añadir Tarea
          </button>
        </div>
        <div class="d-flex gap-3">
          <p>Tareas pendientes: {{tareasPendientes}}</p>
          <p>Total de tareas: {{totalTareas}}</p>
        </div>
        <ul class="list-group">
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            v-for="tarea in tareas"
            v-bind:key="tarea.id"
          >
            {{tarea.id}} - {{tarea.texto}}
            <span>
              <input
                class="form-check-input"
                type="checkbox"
                v-model="tarea.completada"
              />
            </span>
          </li>
        </ul>
        <p class="fs-4 mt-3">Eventos del Ciclo de Vida de Vue JS</p>
        <ul class="list-group mt-3">
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            v-for="evento in listaeventos"
            v-bind:key="evento.id"
          >
            {{ evento.nombre }} - {{ evento.timestamp }}
          </li>
        </ul>
      </div>
    </div>
    <script>
      var app = new Vue({
        el: "#app",
        data: {
          nombre: "Ana García",
          edad: 30,
          ciudad: "Tupungato",
          contador: 0,
          nuevaTarea: "",
          tareas: [
            { id: 1, texto: "Aprender Vue JS", completada: false },
            { id: 2, texto: "Aprender Django", completada: false },
            { id: 3, texto: "Aprender SQL", completada: false },
          ],
          listaeventos: [],
        },
        methods: {
          incrementar() {
            this.contador++;
          },
          decrementar() {
            this.contador--;
            if (this.contador < 0) {
              this.contador = 0;
            }
          },
          agregarTarea() {
            this.tareas.push({
              id: this.tareas.length + 1,
              texto: this.nuevaTarea,
              completada: false,
            });
            this.nuevaTarea = "";
          },
        },
        computed: {
          tareasPendientes() {
            let count = 0;
            for (const tarea of this.tareas) {
              if (tarea.completada === false) {
                count++;
              }
            }
            return count;
          },
          totalTareas() {
            return this.tareas.length;
          },
        },
        beforeCreate() {
          console.log("beforeCreate", Date.now());
        },
        created() {
          this.listaeventos.push({
            id: this.listaeventos.length + 1,
            nombre: "created",
            timestamp: Date.now(),
          });
        },
        beforeMount() {
          this.listaeventos.push({
            id: this.listaeventos.length + 1,
            nombre: "beforeMount",
            timestamp: Date.now(),
          });
        },
        mounted() {
          this.listaeventos.push({
            id: this.listaeventos.length + 1,
            nombre: "mounted",
            timestamp: Date.now(),
          });
        },
        beforeUpdate() {
          console.log("beforeUpdate", Date.now());
        },
        updated() {
          console.log("updated", Date.now());
        },
        beforeDestroy() {
          this.listaeventos.push({
            id: this.listaeventos.length + 1,
            nombre: "beforeDestroy",
            timestamp: Date.now(),
          });
        },
        destroyed() {
          console.log("destroyed", Date.now());
        },
      });
    </script>
  </body>
</html>
