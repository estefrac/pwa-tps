<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>PWA - TP1</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  </head>
  <body>
    <div id="app" class="container mt-3">
      <p class="fs-4">
        Hola, mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}}.
      </p>
      <p class="fs-1 fw-bold">{{contador}}</p>
      <button class="btn btn-primary" v-on:click="incrementar">
        Incrementar
      </button>
      <button class="btn btn-primary" v-on:click="decrementar">
        Decrementar
      </button>
    </div>
    <script>
      var app = new Vue({
        el: "#app",
        data: {
          nombre: "Ana García",
          edad: 30,
          ciudad: "Tupungato",
          contador: 0,
        },
        methods: {
          incrementar() {
            this.contador++;
          },
          decrementar() {
            this.contador--;
            if (this.contador < 0) {
              this.contador = 0;
            }
          },
        },
        computed: {},
      });
    </script>
  </body>
</html>
